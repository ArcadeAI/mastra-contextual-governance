[project]
name = "approvals"
version = "0.0.0"
description = "Human-in-the-loop approvals toolkit — request_approval and decide, over Slack Block Kit."
requires-python = ">=3.11"
dependencies = [
    "arcade-mcp>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["approvals"]
