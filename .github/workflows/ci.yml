name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version the Dockerfiles run, so CI and the deployed
          # images cannot disagree about the runtime.
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The hook contract is generated from a vendored copy of Arcade's OpenAPI
      # document. `bun test` catches a stale committed file too, but this step
      # names the cause and the fix instead of failing as an opaque string diff.
      - name: Hook contract is regenerated from the vendored spec
        run: bun run --cwd packages/policy-schema generate:check

      - name: Test
        run: bun test

      # `bun test` and `tsc` never exercise `apps/web`'s build, and a Next.js
      # build is where most of this service's failures show up.
      - name: Build web
        run: bun run --cwd apps/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  images:
    name: build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [hooks, loan-mcp, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # All three services are runtime: docker with hand-written Dockerfiles,
      # so without this the entire container path is only ever exercised by a
      # Render deploy. A workspace added without its matching
      # `COPY packages/<new>/package.json` line would keep CI green and then
      # fail `bun install --frozen-lockfile` inside the image at deploy time.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
