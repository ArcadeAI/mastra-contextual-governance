name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version the Dockerfiles run, so CI and the deployed
          # images cannot disagree about the runtime.
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # `bun test` and `tsc` never exercise `apps/web`'s build, and a Next.js
      # build is where most of this service's failures show up.
      - name: Build web
        run: bun run --cwd apps/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
